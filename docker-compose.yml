version: '3.9'

services:
  mysql:
    image: mysql:8.0
    container_name: sonora_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sonora_cms
      MYSQL_USER: sonora
      MYSQL_PASSWORD: sonora123
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: sonora_phpmyadmin
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "8080:80"

volumes:
  mysql_data:
